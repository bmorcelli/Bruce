; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-sticks3]
board = esp32s3
board_build.psram = enabled
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-sticks3>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-Iboards/m5stack-sticks3
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_M5STICK_S3
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DESP32S3

	-DHAS_3_BUTTONS
	-DM5STICK
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=39
	-DDEEPSLEEP_PIN_ACT=LOW
	-DCONFIG_SPIRAM=y
	-DCONFIG_SPIRAM_MODE_OCT=1
	-DCONFIG_SPIRAM_USE_MALLOC=1
	-DCONFIG_SPIRAM_BOOT_INIT=1
	-DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1

	;Features Enabled
	;-DLITE_VERSION=1 ;limits some features to save space for M5Launcher Compatibility
	-DMIC_SPM1423=1 ;Applicable for SPM1423 device
	;FM Radio
	-DFM_SI4713=1


	; ES8311 Codec (ADV)
	-D ES8311_CODEC=1
	-D ES8311_ADDR=0x18

	-DHAS_NS4168_SPKR=1 ;uncomment to enable

	-DBCLK=17
	-DWCLK=15
	-DDOUT=14
	-DMCLK=18

	-DPIN_CLK=15
	-DPIN_BCLK=17
	-DPIN_DATA=16

	;Can run USB as HID
	-DUSB_as_HID=1 ;uncomment to enable
	;-DBAD_TX=25 ; Using pin header
	;-DBAD_RX=26 ; Using pin header
	;-DBAD_TX=32  ; Using Grove
	;-DBAD_RX=33	 ; Using Grove

	;Buttons configuration
	-DBTN_ALIAS='"M5"'

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Infrared Led default pin and state
	-DIR_TX_PINS='{ {"Default", 46}, {"M5 IR Mod", 9}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'
	-DIR_RX_PINS='{ {"Default", 42}, {"M5 IR Mod", 10}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 9}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 10}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'

	-DFP=1
	-DFM=2
	-DFG=3

	-DHAS_SCREEN=1
	-DROTATION=3

	; Using M5GFX driver
	-DUSE_M5GFX=1

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=41
	-DTFT_DC=45
	-DTFT_RST=21
	-DTFT_MOSI=39
	-DTFT_SCLK=40
	-DTFT_MISO=-1
	-DTFT_BL=38
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000



	-DDEVICE_NAME='"M5StickS3"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified

lib_ignore =
	TFT_eSPI
