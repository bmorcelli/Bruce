; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nm-cyd-c5]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/nm-cyd-c5>
build_flags =
	${env.build_flags}
	-Iboards/nm-cyd-c5
	-DESP32C5
	-DESP32C5_DEVKITC_1
	-DDEVICE_NAME='"ESP32-C5"'
	-DNM_CYD_ESP32C5=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DHAS_TOUCH=1
	-DROTATION=3

	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h
	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; ir led pin
	-DIR_TX_PINS='{{"Pin 9", 9}, {"Pin 8", 8}}'
	-DIR_RX_PINS='{{"Pin 9", 9}, {"Pin 8", 8}}'
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 9", 9}, {"Pin 8", 8}}'
	-DRF_RX_PINS='{{"Pin 9", 9}, {"Pin 8", 8}}'

	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; ui control buttons
	;-DSEL_BTN=1
	;-DUP_BTN=2  ; also work as ESC
	;-DDW_BTN=3  ; also work as NEXT
	-DBTN_ALIAS='"OK"'

	;FM Radio
	-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713

	; --- migrated from pins_arduino.h ---
	-DPIN_RGB_LED=27
	; BUILTIN_LED can be used in new Arduino API digitalWrite() like in Blink.ino
	; RGB_BUILTIN and RGB_BRIGHTNESS can be used in new Arduino API rgbLedWrite()
	; LP I2C Pins are fixed on ESP32-C5
	-DLP_SDA=4
	-DLP_SCL=5
	-DWIRE1_PIN_DEFINED
	-DHAS_RGB_LED=1
	-DLED_ORDER=GRB
	-DLED_TYPE_IS_RGBW=1
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	; SPI
	-DHAS_SCREEN=1
	-DMINBRIGHT=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	; Common TFT definitions
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=-1
	-DTFT_DC=24
	-DTFT_MISO=2
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=23
	-DTOUCH_CS=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DUSE_TFT_eSPI_TOUCH=1
	-DBTN_ACT=LOW
	-DDEEPSLEEP_WAKEUP_PIN=0

