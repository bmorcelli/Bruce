; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus2]
board = esp32
board_build.partitions = custom_8Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus2>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cplus2
	-DCORE_DEBUG_LEVEL=1
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-DARDUINO_M5STICK_C_PLUS2
	-DBOARD_HAS_PSRAM

	;Features Enabled
	;-DLITE_VERSION=1 ;limits some features to save space for M5Launcher Compatibility
	-DMIC_SPM1423=1 ;Applicable for SPM1423 device
	;FM Radio
	-DFM_SI4713=1
	-DFM_RSTPIN=0
	-DPIN_CLK=0
	-DI2S_SCLK_PIN=0
	-DI2S_DATA_PIN=34
	-DPIN_DATA=34

	;Have RTC Chip
	-DHAS_RTC=1

	;Have buzzer
	-DBUZZ_PIN=2

	;Can run USB as HID
	;-DUSB_as_HID=1 ;uncomment to enable
	; BAD_TX/BAD_RX (BadUSB CH9329) migrated to bruceConfigPins.badusb_bus in _setup_gpio()
	; (was BAD_TX=32/BAD_RX=33, Grove; pin-header alt. was 25/26)

	;Buttons configuration
	-DHAS_BTN=1
	-DSEL_BTN=37
	-DUP_BTN=35
	-DDW_BTN=39
	-DBTN_ACT=LOW
	-DBTN_ALIAS='"M5"'

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Infrared Led default pin and state
	; TXLED (19) / GROVE_SDA (32) / GROVE_SCL (33) resolved to literals below (both macros
	; migrated to bruceConfigPins.irTx/i2c_bus in _setup_gpio())
	-DIR_TX_PINS='{ {"Default", 19}, {"M5 IR Mod", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DIR_RX_PINS='{ {"M5 IR Mod", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'

	; CC1101_*/NRF24_*/W5500_*/LORA_*/SDCARD_*/GROVE_*/SYS_I2C_*/TXLED/BAD_TX/BAD_RX/ROTATION
	; migrated to bruceConfigPins.* in _setup_gpio() (see boards/m5stack-cplus2/interface.cpp)

	-D ANALOG_BAT_PIN=38

	-DFP=1
	-DFM=2
	-DFG=3

	-DHAS_SCREEN=1
	-DROTATION=3
	-DBACKLIGHT=27
	-DMINBRIGHT=160

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_CS=5
	-DTFT_DC=14
	-DTFT_RST=12
	-DTOUCH_CS=-1
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=27
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000


	-DDEVICE_NAME='"M5StickC Plus2"'

	; pins_arduino.h pins
	-DHAS_3_BUTTONS
	-DM5STICK
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=39
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
