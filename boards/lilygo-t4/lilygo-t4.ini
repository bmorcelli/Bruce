[env:lilygo-t4]
board = esp32
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t4>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/lilygo-t4
	-DREDRAW_DELAY=1 # Used to improve navigation on menus for this device

	-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Lilygo T4 v1.3"'

	; This T4 ILI9341 panel renders correctly without color inversion,
	; unlike most Bruce panels which default to inverted.
	-DDEFAULT_COLOR_INVERTED=0

	-DARDUINO_ESP32_DEV
	-DLILYGO_T4

	; ------------------------------------------------------------------ Main I2C (Grove)
	-DGROVE_SDA=21
	-DGROVE_SCL=22
	; ------------------------------------------------------------------ Secondary SPI (external RF modules)
	; No RF module is fitted on the T4; these are sane defaults on free GPIOs so
	; CC1101 / NRF24 modules can be wired manually. ALLOW_ALL_GPIO_FOR_IR_RF lets
	; the user re-map any of these at runtime.
	-DSPI_SCK_PIN=25
	-DSPI_MOSI_PIN=26
	-DSPI_MISO_PIN=33
	-DSPI_SS_PIN=17
	; Arduino default SPI globals (used by a bare SPI.begin())
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=34
	-DCC1101_SS_PIN=SPI_SS_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=35
	-DNRF24_SS_PIN=SPI_SS_PIN
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	; ------------------------------------------------------------------ SD card (HSPI)
	-DSDCARD_CS=13
	-DSDCARD_SCK=14
	-DSDCARD_MISO=2
	-DSDCARD_MOSI=15
	; ------------------------------------------------------------------ TFT_eSPI display (ILI9341, VSPI)
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=27
	-DTFT_DC=32
	-DTFT_RST=5
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	; ------------------------------------------------------------------ Display setup
	-DHAS_SCREEN
	-DROTATION=1
	-DMINBRIGHT=1
	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; ------------------------------------------------------------------ Serial / GPS / BadUSB
	; Default to the Grove pins; can be re-mapped from Bruce's settings.
	-DSERIAL_TX=GROVE_SDA
	-DSERIAL_RX=GROVE_SCL
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL
	; ------------------------------------------------------------------ Buttons & navigation
	; The three front buttons sit on ESP32 input-only GPIOs (34-39), so they rely
	; on the board's external pull-ups and are active LOW. See interface.cpp.
	; LEFT   (38) -> Previous / Up
	; CENTER (37) -> Select (click) / Escape (double-click or hold)
	; RIGHT  (39) -> Next / Down
	-DBTN_ALIAS='"Sel"'
	-DHAS_3_BUTTONS
	-DUP_BTN=38
	-DSEL_BTN=37
	-DDW_BTN=39
	-DBTN_ACT=LOW
	; ------------------------------------------------------------------ IR default pins
	-DTXLED=26
	-DRXLED=25
	-DLED_ON=HIGH
	-DLED_OFF=LOW

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	${env_4mb.lib_ignore}
