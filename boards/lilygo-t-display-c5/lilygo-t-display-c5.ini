; ---------------------------------------------------------------------
; LILYGO T-Display-C5  (ESP32-C5, ST7789 170x320, no touch, AXP2602 PMU)
; Bruce board environment — add this to platformio.ini (or include it)
; ---------------------------------------------------------------------

[env:lilygo-t-display-c5]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lilygo-t-display-c5>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-display-c5
	-DDEVICE_NAME='"T-Display-C5"'
	-DLILYGO_T_DISPLAY_C5=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DESP32C5
	-DESP32C5_DEVKITC_1

	; use any GPIO for IR/RF except TFT + reserved pins
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; single physical select button label
	-DBTN_ALIAS='"OK"'

	; FM Radio (optional, needs Adafruit Si4713 on I2C)
	;-DFM_SI4713=1

	; ---- migrated from pins_arduino.h ----
	; LP I2C / LP UART pins are fixed on ESP32-C5
	-DLP_SDA=4
	-DLP_SCL=5
	-DWIRE1_PIN_DEFINED
	-DHAS_RGB_LED=1
	-DLED_ORDER=GRB
	-DLED_TYPE=WS2812
	-DLED_COUNT=1
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	-DSERIAL_TX=11
	-DSERIAL_RX=12
	-DGROVE_SDA=2
	-DGROVE_SCL=3
	-DSPI_SCK_PIN=7
	-DSPI_MOSI_PIN=9
	-DSPI_MISO_PIN=6
	-DSPI_SS_PIN=4
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	; (red shows blue, purple shows pink; green OK)
	-DTFT_INVERSION_ON
	; Confirmed from the factory sketch: the 170-wide panel needs a 35px gap on
	; its short axis (esp_lcd set_gap(0,35)). Recent TFT_eSPI auto-applies this
	; for a 170x320 ST7789; if the image is shifted, that's the value to nudge.
	-DCGRAM_OFFSET
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=23
	-DTFT_DC=8
	-DTFT_CS=26
	-DTFT_MOSI=9
	-DTFT_SCLK=7
	-DTFT_MISO=6
	; init wants a real MISO GPIO assigned (matches
	; the working nm-cyd-c5); shares pin 6 with radios
	-DSMOOTH_FONT=1
	; 20MHz to match the known-good C5+ST7789 SPI board (nm-cyd-c5). TFT_eSPI's
	; C5 SPI path is unreliable at 40MHz (backlight on but no image); the factory
	; sketch only reached 40MHz via the native esp_lcd driver, not TFT_eSPI.
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DHAS_2_BUTTONS
	-DBTN_A=0
	-DBTN_B=28
	-DBTN_ACT=LOW
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DTXLED=1
	-DRXLED=1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	; CC1101 (SubGHz)
	-DCC1101_GDO0_PIN=5
	-DCC1101_SS_PIN=4
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	; NRF24 (2.4GHz)
	-DNRF24_CE_PIN=5
	-DNRF24_SS_PIN=4
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	; W5500 (Ethernet)
	-DW5500_INT_PIN=5
	-DW5500_SS_PIN=4
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	; GPS - shares GPIO 4/5 with the radios; use one or the other
	-DGPS_SERIAL_TX=5
	-DGPS_SERIAL_RX=4
	; Bad-USB via CH9329 (ESP32-C5 has no USB-OTG) - on the I2C/serial pins
	-DBAD_RX=2
	-DBAD_TX=3
