; PlatformIO Project Configuration File
;
; Freenove-FNK0104AB - 2.8" IPS ESP32-S3 Display Module with Capacitive Touch
; Manufacturer: Freenove (FNK0104B) — ILI9341 2.8" variant of the ES3C28P design
;
; Hardware:
;   - ESP32-S3R8 (8MB OPI PSRAM, 16MB QSPI Flash)
;   - ILI9341V 240x320 IPS TFT (4-wire SPI)
;   - FT6336G Capacitive Touch (I2C)
;   - ES8311 Audio Codec + FM8002E Amplifier
;   - MicroSD Card (SDIO mode)
;   - WS2812 RGB LED
;   - Battery ADC with voltage divider
;   - BOOT button (GPIO0)

[env:Freenove-FNK0104AB]
board = esp32s3
board_build.partitions = boards/Freenove-FNK0104AB/partitions_16Mb.csv
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/Freenove-FNK0104AB>
build_flags =
	${env.build_flags}
	-Iboards/Freenove-FNK0104AB
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DFREENOVE_FNK0104AB
	-DDISABLE_ALL_LIBRARY_WARNINGS

	-DDEVICE_NAME='"Freenove FNK0104AB"'

	; TFT SPI port for ESP32-S3
	-DUSE_HSPI_PORT=1

	; SD Card via SDIO (not SPI)
	-DUSE_SD_MMC=1
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	; Touch screen
	-DHAS_TOUCH=1

	; Allow all GPIOs for IR/RF (user wires external modules)
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; Redraw delay to improve menu navigation on this display
	-DREDRAW_DELAY=1

	; --- migrated from pins_arduino.h ---
	; =============================================
	; I2C Bus (shared between touch, audio codec, expansion)
	; Touch FT6336G @ 0x38, Audio ES8311 @ 0x18
	; =============================================
	-DGROVE_SDA=16
	-DGROVE_SCL=15
	; =============================================
	; Main SPI Bus (exposed on expansion pins)
	; Used for CC1101, NRF24, W5500 external modules
	; =============================================
	-DSPI_SCK_PIN=14
	-DSPI_MOSI_PIN=3
	-DSPI_MISO_PIN=2
	-DSPI_SS_PIN=21
	; =============================================
	; SD Card - Uses SDIO mode (not SPI)
	; SD_CLK=38, SD_CMD=40, SD_D0=39, SD_D1=41, SD_D2=48, SD_D3=47
	; =============================================
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	; =============================================
	; CC1101 Sub-GHz Radio (external module via expansion pins)
	; =============================================
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=2
	-DCC1101_SS_PIN=21
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	; =============================================
	; NRF24L01 2.4GHz Radio (external module via expansion pins)
	; =============================================
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=3
	-DNRF24_SS_PIN=21
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	; =============================================
	; W5500 Ethernet (external module via expansion pins)
	; =============================================
	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1
	; =============================================
	; TFT Display (ILI9341V via SPI)
	; =============================================
	-DUSER_SETUP_LOADED
	-DILI9341_2_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=-1
	-DTFT_BL=45
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; =============================================
	; Display Setup
	; =============================================
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	-DBACKLIGHT=45
	; =============================================
	; Touch Screen (FT6336G via I2C @ 0x38)
	; =============================================
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_FT6336_I2C=1
	-DFT6336_I2C_ADDR=0x38
	-DFT6336_I2C_CONFIG_SDA=16
	-DFT6336_I2C_CONFIG_SCL=15
	-DFT6336_TOUCH_CONFIG_RST=18
	-DFT6336_TOUCH_CONFIG_INT=17
	; =============================================
	; Font Sizes
	; =============================================
	-DFP=1
	-DFM=2
	-DFG=3
	; =============================================
	; RGB LED (WS2812 NeoPixel)
	; =============================================
	-DHAS_RGB_LED=1
	-DRGB_LED=40
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_TYPE_IS_RGBW=0
	-DLED_COUNT=1
	-DLED_COLOR_STEP=5
	; =============================================
	; Buttons
	; =============================================
	-DHAS_BTN=1
	-DBTN_ALIAS='"Boot"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW
	-DSEL_BTN=0
	; =============================================
	; Audio System (ES8311 codec + I2S + FM8002E amplifier)
	; ES8311 I2C: SDA=16, SCL=15 (shared with touch)
	; I2S: MCLK=4, BCLK=5, LRC=7, DOUT=8, DIN=6
	; =============================================
	-DHAS_NS4168_SPKR=1
	-DES8311_CODEC=1
	-DES8311_ADDR=0x18
	-DI2S_MCLK_PIN=4
	-DBCLK=5
	-DWCLK=7
	-DDOUT=8
	-DMCLK=4
	-DAMP_EN_PIN=1
	; Microphone (via ES8311 ADC)
	-DMIC_SPM1423=1
	-DPIN_CLK=7
	-DI2S_SCLK_PIN=5
	-DI2S_DATA_PIN=6
	-DPIN_DATA=6
	; =============================================
	; Battery ADC
	; =============================================
	-DANALOG_BAT_PIN=8
	-DANALOG_BAT_MULTIPLIER=2.0f
	; =============================================
	; Infrared (external, via expansion pins)
	; =============================================
	-DTXLED=2
	-DRXLED=3
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"GPIO2", 2}, {"GPIO3", 3}, {"GPIO14", 14}, {"GPIO21", 21}}'
	-DIR_RX_PINS='{{"GPIO2", 2}, {"GPIO3", 3}, {"GPIO14", 14}, {"GPIO21", 21}}'
	; =============================================
	; RF (external, via expansion pins)
	; =============================================
	-DRF_TX_PINS='{{"GPIO2", 2}, {"GPIO3", 3}, {"GPIO14", 14}, {"GPIO21", 21}}'
	-DRF_RX_PINS='{{"GPIO2", 2}, {"GPIO3", 3}, {"GPIO14", 14}, {"GPIO21", 21}}'
	; =============================================
	; Serial (GPS) dedicated pins
	; =============================================
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	; =============================================
	; BadUSB (USB HID)
	; =============================================
	-DUSB_as_HID=1
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL
	; =============================================
	; Deep Sleep
	; =============================================
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}

lib_ignore =
	SD
