[env:lilygo-t-display-s3]
board = esp32s3
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-s3>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-display-s3
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DREDRAW_DELAY=1 # Used to improve navigation on menus for this device
	-DMIC_SPM1423

	-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;-UARDUINO_USB_CDC_ON_BOOT #Turn off CDC on boot https://github.com/Xinyuan-LilyGO/T-Display-S3
	-DDISABLE_ALL_LIBRARY_WARNINGS

	;pins_arduino.h migration - default (non USE_SD_MMC) pin set; the -mmc envs
	;below carry their own equivalent block for when USE_SD_MMC is defined
	-DDEVICE_NAME='"Lilygo T-Display S3"'
	-DSPI_SS_PIN=10
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SCK_PIN=12

	-DSDCARD_CS=1
	-DSDCARD_SCK=SPI_SCK_PIN
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN

	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=21
	-DCC1101_SS_PIN=2
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=3
	-DNRF24_SS_PIN=10
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1

	;GROVE_SDA/SCL and TXLED/RXLED below are the defaults; the -touch envs
	;override them with their own -D (last one wins)
	-DGROVE_SDA=44
	-DGROVE_SCL=43
	-DTXLED=17
	-DRXLED=18

	-DSERIAL_TX=44
	-DSERIAL_RX=43


	-DUSER_SETUP_LOADED
	-DST7789_DRIVER=1
	-DTFT_BACKLIGHT_ON=1
	-DINIT_SEQUENCE_3
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=38
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_WR=8
	-DTFT_RD=9

	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	-DHAS_SCREEN
	-DROTATION=3
	-DMINBRIGHT=1

	-DFP=1
	-DFM=2
	-DFG=3

	; Battery PIN
	-DPIN_POWER_ON=15
	-DANALOG_BAT_PIN=4

	; Mic
	-DPIN_CLK=39
	-DPIN_DATA=42

	; Buttons & Navigation
	-DBTN_ALIAS='"OK"'
	-DHAS_3_BUTTONS
	-DSEL_BTN=16
	-DUP_BTN=0
	-DDW_BTN=14
	-DBTN_ACT=LOW

	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DUSB_as_HID=1

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button
	https://github.com/mmMicky/TouchLib


[env:lilygo-t-display-s3-touch]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}
	-DHAS_TOUCH=1
	-DDEVICE_NAME='"Lilygo T-Display S3 Touch"'

	; Set I2C to use the same Touchscreen pins
	-D GROVE_SDA=18
	-D GROVE_SCL=17
	-D SYS_I2C_SDA=18
	-D SYS_I2C_SCL=17
	; Move IR pins to GDO0 and CE pin, can cause Jamming if radio is on TX mode
	-D TXLED=3
	-D RXLED=21

[env:lilygo-t-display-s3-mmc]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}
	-DUSE_SD_MMC=1
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	;pins_arduino.h migration - USE_SD_MMC pin set overrides
	-DSPI_SS_PIN=1
	-DSPI_MOSI_PIN=3
	-DSPI_MISO_PIN=2
	-DSPI_SCK_PIN=43
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	-DCC1101_GDO0_PIN=44
	-DCC1101_SS_PIN=1
	-DCC1101_MOSI_PIN=3
	-DCC1101_SCK_PIN=43
	-DCC1101_MISO_PIN=2
	-DNRF24_CE_PIN=17
	-DNRF24_SS_PIN=18
	-DNRF24_MOSI_PIN=3
	-DNRF24_SCK_PIN=43
	-DNRF24_MISO_PIN=2
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=3
	-DW5500_SCK_PIN=43
	-DW5500_MISO_PIN=2
	-DW5500_INT_PIN=-1
	-DGROVE_SDA=16
	-DGROVE_SCL=21
	-DSERIAL_TX=21
	-DSERIAL_RX=16
	-DTXLED=10
	-DRXLED=44

lib_ignore =
	SD


[env:lilygo-t-display-s3-touch-mmc]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}
	-DHAS_TOUCH=1
	-DUSE_SD_MMC=1
	-DDEVICE_NAME='"Lilygo T-Display S3 Touch"'
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	;pins_arduino.h migration - USE_SD_MMC pin set overrides (before the
	;touch-specific overrides below, which must win)
	-DSPI_SS_PIN=1
	-DSPI_MOSI_PIN=3
	-DSPI_MISO_PIN=2
	-DSPI_SCK_PIN=43
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	-DCC1101_GDO0_PIN=44
	-DCC1101_SS_PIN=1
	-DCC1101_MOSI_PIN=3
	-DCC1101_SCK_PIN=43
	-DCC1101_MISO_PIN=2
	-DNRF24_CE_PIN=17
	-DNRF24_SS_PIN=18
	-DNRF24_MOSI_PIN=3
	-DNRF24_SCK_PIN=43
	-DNRF24_MISO_PIN=2
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=3
	-DW5500_SCK_PIN=43
	-DW5500_MISO_PIN=2
	-DW5500_INT_PIN=-1
	-DGROVE_SDA=16
	-DGROVE_SCL=21
	-DTXLED=10
	-DRXLED=44

	; Move I2C Pins to the same Touchscreen pins
	-D GROVE_SDA=18
	-D GROVE_SCL=17

	; Move NRF24 to not break touchscreen
	-D NRF24_CE_PIN=44 ; share with IR RX
	-D NRF24_SS_PIN=16 ; share with Serial TX
	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=16
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

lib_ignore =
	SD

