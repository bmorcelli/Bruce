; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-watch-s3]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-watch-s3>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-watch-s3
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	-D REMOVE_RFID_HW_INTERFACE  # Remove Hardware interface due to lack of External GPIO

	;Microphone
	-DMIC_SPM1423=1  ;uncomment to enable Applicable for SPM1423 device

	;Have RTC Chip
	-DHAS_RTC=1

	;Speaker to run music, compatible with NS4168
	-DHAS_NS4168_SPKR=1  ;uncomment to enable

	;Can run USB as HID
	-DUSB_as_HID=1  ;uncomment to enable

	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================

	;TFT_eSPI display
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	;-DUSER_SETUP_ID=214
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_INVERSION_ON
	-DTFT_BL=45
	-DTFT_MISO=-1
	-DTFT_MOSI=13
	-DTFT_SCLK=18
	-DTFT_CS=12
	-DTFT_DC=38
	-DTFT_RST=-1
	-DTOUCH_CS=-1

	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================

	;Features Enabled
	# Config to use IRQ and RST pins of PN532, if needed
	;-DPN532_RF_REST=-1
	;-DPN532_IRQ=-1
	-DPIN_CLK=44
	-DPIN_DATA=47
	-DRGB_LED=-1
	-DRTC_SDA=10
	-DRTC_SCL=11
	-DBCLK=48
	-DWCLK=15
	-DDOUT=46
	-DMCLK=44

	;Buttons configuration
	-DBTN_ALIAS='"Mid"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"IO 2", 2}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	;Font sizes, depending on device
	-DROTATION=2

	-DDEVICE_NAME='"Lilygo T-Watch S3"'
	-DKB_HID_EXIT_MSG='"Mid Btn + Space to exit"'


