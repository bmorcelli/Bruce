; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:NewDeviceModel]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; VERIFY: old JSON had no explicit memory_type (template board, assumed no on-board
; PSRAM like its ESP-General base); generic esp32s3 default is qio_opi. Overriding
; to qio_qspi so a real board cloned from this template without octal PSRAM doesn't
; try to init a PSRAM chip that isn't populated. Adjust/remove if the real device
; has octal PSRAM.
board_build.arduino.memory_type = qio_qspi
build_flags =
	${env.build_flags}
	-Iboards/_New-Device-Model

	; ==================== Framework Control Flags ====================
	; Flags that configure the Arduino/ESP-IDF framework itself, not this
	; app's features.
	-DCORE_DEBUG_LEVEL=1          ; Arduino core log verbosity (0=none .. 5=verbose)
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0 (used only on ESP32-S3 to make Serial Commands work)
	-DARDUINO_USB_MODE=1          ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC, required alongside ARDUINO_USB_CDC_ON_BOOT)

	; ==================== Feature gates ====================
	; Each of these turns on (or, commented, leaves off) a whole optional
	; subsystem at compile time. Uncomment the ones this real device has,
	; and keep their companion pin defines in sync (see Environment Flags).
	;-D USE_TFT_eSPI_TOUCH=1		; Skips InputHangler task, serializing the input readings
	;-D HAS_TOUCH=1					; Board has a touchscreen controller (needs TOUCH_CS and, for capacitive panels, the touch driver flags below)
	;-D HAS_RGB_LED=1				; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	;-D HAS_ENCODER_LED				; Has LEDs on the Encoder wheel
	;-D HAS_RTC=1					; Board has an RTC chip (needs RTC_SDA/RTC_SCL)
	;-D HAS_RTC_PCF85063A=1			; using PCF85063A RTC Chip
	;-D HAS_RTC_BM8563=1			; using BM8563 RTC chip
	;-D HAS_NS4168_SPKR=1			; Board has an NS4168 I2S speaker (needs BCLK/WCLK/DOUT)
	;-D MIC_SPM1423=1				; Board has an SPM1423 I2S microphone (needs PIN_CLK/PIN_DATA)
	;-D MIC_INMP441=1				; Board has an INMP441 I2S microphone (needs PIN_CLK/PIN_DATA)
	;-D USB_as_HID=1				; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)
	;-D FM_SI4713=1					; Board has an Adafruit Si4713 FM transmitter module
	;-D LITE_VERSION=1				; Trims features to fit smaller flash (M5Launcher-compatible builds)
	;-D ALLOW_ALL_GPIO_FOR_IR_RF=1	; Let the user pick any GPIO (1-44) for IR/RF instead of only the curated IR_TX_PINS/RF_TX_PINS list
	;-D USE_BQ27220_VIA_I2C=1	 	; Read battery from BQ27220 natively
	;-D ANALOG_BAT_PIN=10			; Read battery from voltage multiplier naivelly
	;-D ANALOG_BAT_MULTIPLIER=2		; Analog voltage multiplier
	;-D DISABLE_INTERPRETER=1		; Disable JavaScript Interpreter
	;-D ENABLE_RAM_LOGGING=1		; Enable RAM Logging on Serial
	;-D REMOVE_RFID_HW_INTERFACE=1	; Remove RFID interface from menu


	; ==================== Library Flags (display) ====================

	# Display Driver (Must add the library on `lib_deps`), ArduinoGFX is lib default, doesn't need any flag
	# Refer to `lib\DisplayDrivers\README.md` to set the display accordingly
	;-D USE_M5GFX=1       # to use M5GFX library to drive the display using M5.Display.<>() functions
	;-D USE_GXEPD2=1      # to use GxEPD2 display library
	;-D USE_TFT_ESPI=1    # to use TFT_eSPI library
	;-D USE_LOVYANGFX=1   # to use Lovyan GFX driver
	;-D USE_EPD_PAINTER=1 # to use EPD_PAINTER
	;-D USE_DUMMY_TFT=1   # no display at all, every draw call is a no-op

	; TFT_eSPI "User_Setup" config: these values are read directly by the
	; TFT_eSPI library, not by Bruce's own code.
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1         ; Tells TFT_eSPI to use this build's -D config instead of its bundled User_Setup.h
	-DUSE_HSPI_PORT=1             ; Drive the display on the ESP32 HSPI peripheral
	-DST7789_2_DRIVER=1           ; Panel driver chip
	-DTFT_RGB_ORDER=1             ; Colour order sent to the panel (RGB vs BGR)
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1          ; Logic level that turns the backlight on
	-DTFT_BL=38                   ; Backlight control pin
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1                 ; No touch controller on this board (-1 = absent)
	-DSMOOTH_FONT=1               ; Enable TFT_eSPI anti-aliased font rendering
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	; Board-specific pins, labels and constants consumed directly by Bruce's
	; own code (main.cpp, mykeyboard.cpp, ir/rf/led modules, etc).
	; -- Microphone (MIC_SPM1423) --
	-DPIN_CLK=43
	-DPIN_DATA=46
	; -- RGB LED (HAS_RGB_LED) --
	-DRGB_LED=21
	; -- Speaker (HAS_NS4168_SPKR) --
	-DBCLK=41
	-DWCLK=43
	-DDOUT=42
	; -- Buttons --
	-DBTN_ALIAS='"Ok"'            ; Label shown in the UI for the main select button
	; -- Infrared --
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DTXLED=-1                    ; IR TX status LED pin (-1 = none)
	; -- Radio Frequency (one-pin modules) --
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DRF_RX_PINS='{{"M5 FR433R", GROVE_SCL}, {"Pin 1", 1}, {"Pin 2", 2}}'
	; -- UI font sizes --
	; -DFP=1		; Set only if different of normal
	; -DFM=2		; Set only if different of normal
	; -DFG=3		; Set only if different of normal
	; -- Screen orientation --
	-DROTATION=1

lib_deps =
	${env.lib_deps}
	;moononournation/GFX Library for Arduino @ ^1.5.5
	;lovyan03/LovyanGFX @ ^1.2.7
	;m5stack/M5Unified @ ^0.2.11        + m5stack/M5GFX @ ^0.2.18
	;https://github.com/tonywestonuk/EPD_Painter  ; + adafruit/Adafruit GFX Library @ ^1.12.1
	;zinggjm/GxEPD2 @ ^1.6.4                      ; + adafruit/Adafruit GFX Library @ ^1.12.1
