; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:NewDeviceModel]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; VERIFY: old JSON had no explicit memory_type (template board, assumed no on-board
; PSRAM like its ESP-General base); generic esp32s3 default is qio_opi. Overriding
; to qio_qspi so a real board cloned from this template without octal PSRAM doesn't
; try to init a PSRAM chip that isn't populated. Adjust/remove if the real device
; has octal PSRAM.
board_build.arduino.memory_type = qio_qspi
build_flags =
	${env.build_flags}
	-Iboards/_New-Device-Model
	-Os
	-DCORE_DEBUG_LEVEL=1
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; Used only in ESP32-S3 to make Serial Comands work
	-DARDUINO_USB_MODE=1

	; pins_arduino.h pins
	; Modified elsewhere
	-DPIN_CLK=43
	-DPIN_DATA=46
	-DRGB_LED=21
	-DBCLK=41
	-DWCLK=43
	-DDOUT=42
	-DBTN_ALIAS='"Ok"'
	-DBTN_ACT=LOW
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DRF_RX_PINS='{{"M5 FR433R", GROVE_SCL}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_SCREEN=1
	-DROTATION=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14
	-DGROVE_SDA=2
	-DGROVE_SCL=1

lib_deps =
	${env.lib_deps}
	xylopyrographer/LiteLED@^1.2.0
