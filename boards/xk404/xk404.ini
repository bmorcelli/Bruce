; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:xk404]
board = esp32s3

build_src_filter =${env.build_src_filter} +<../boards/xk404>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/xk404
	-Os
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DXK404
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 4", 4}, {"GPIO 1", 1}}'
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	;Have buzzer
	;-DMIC_SPM1423
	-DBUZZ_PIN=40
	-D USE_HSPI_PORT=1
	-DDEVICE_NAME='"xk404"'
	; --- migrated from pins_arduino.h ---
	-DSPI_SCK_PIN=17
	-DSPI_MOSI_PIN=18
	-DSPI_MISO_PIN=8
	-DSPI_SS_PIN=5
	; Modified elsewhere
	-DSERIAL_RX=44
	-DSERIAL_TX=43
	-DBAD_RX=SERIAL_RX
	-DBAD_TX=SERIAL_TX
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DUSB_as_HID=1
	-DGROVE_SDA=47
	-DGROVE_SCL=48
	-DSYS_I2C_SDA=47
	-DSYS_I2C_SCL=48
	-DBTN_ALIAS='"OK"'
	-DHAS_5_BUTTONS
	-DSEL_BTN=0
	-DUP_BTN=39
	-DDW_BTN=38
	-DR_BTN=11
	-DL_BTN=10
	-DBTN_ACT=LOW
	-DRXLED=1
	-DTXLED=2
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=9
	; #define CC1101_GDO2_PIN 10
	-DCC1101_SS_PIN=46
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=13
	-DNRF24_SS_PIN=12
	-DNRF24_MOSI_PIN=SDCARD_MOSI
	-DNRF24_SCK_PIN=SDCARD_SCK
	-DNRF24_MISO_PIN=SDCARD_MISO
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_SCREEN=1
	-DROTATION=3
	-DMINBRIGHT=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MISO=SPI_MISO_PIN
	-DTFT_MOSI=SPI_MOSI_PIN
	-DTFT_SCLK=SPI_SCK_PIN
	-DTFT_CS=7
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000
	-DSDCARD_CS=3
	-DSDCARD_SCK=SPI_SCK_PIN
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN
	-DUSE_BOOST
	-DXPOWERS_CHIP_BQ25896

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0

