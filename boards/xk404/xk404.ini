; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:xk404]
board = esp32s3

build_src_filter =${env.build_src_filter} +<../boards/xk404>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/xk404
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DIR_TX_PINS='{{"M5 IR Mod", 47}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 48}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 4", 4}, {"GPIO 1", 1}}'
	-DRF_TX_PINS='{{"M5 RF433T", 47}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", 48}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	;Have buzzer
	;-DMIC_SPM1423
	-DBUZZ_PIN=40
	-D USE_HSPI_PORT=1
	-DDEVICE_NAME='"xk404"'
	; --- migrated from pins_arduino.h ---
	; Modified elsewhere
	-DUSB_as_HID=1
	-DBTN_ALIAS='"OK"'
	-DHAS_5_BUTTONS
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_SCREEN=1
	-DROTATION=3
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MISO=8
	-DTFT_MOSI=18
	-DTFT_SCLK=17
	-DTFT_CS=7
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000
	-DUSE_BOOST

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0

