; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:arduino-nesso-n1]
board = esp32c6
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/arduino-nesso-n1>
build_flags =
	${env.build_flags}
	-Iboards/arduino-nesso-n1
	; LP I2C Pins are fixed on ESP32-C6
	-DWIRE1_PIN_DEFINED
	-D DEVICE_NAME='"M5DinMeter"'
	-D HAS_TOUCH=1
	-D HAS_3_BUTTONS=1

	-D BTN_ALIAS='"SEL"'
	-D LED=-1
	-D LED_ON=HIGH
	; Using M5GFX driver
	-D HAS_SCREEN=1
	-D ROTATION=3

	-D USE_TFT_eSPI_TOUCH=1 #Dont use InputHandler_Task
	-D USE_M5GFX=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D TFT_MISO=22
	-D TFT_MOSI=21
	-D TFT_CS=17
	-D TFT_RST=16


	;Default I2C port
	-D BRUCE_BOARD_HAS_SOFTWARE_I2C=1

	;Features Enabled
	;-DLITE_VERSION=1 ;limits some features to save space for M5Launcher Compatibility
	;-DMIC_SPM1423=1 ;Applicable for SPM1423 device
	;FM Radio
	-D FM_SI4713=1

	;Sound options
	-D BUZZ_PIN=11

	;Can run USB as HID
	;-D USB_as_HID=1 ;uncomment to enable

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins
	;Infrared Led default pin and state
	-D IR_TX_PINS='{{"Default",9},{"M5 IR Mod", 5},{"G2",2},{"G6",6},{"G7",7},{"Grove 4",4},{"Grove 5",5}}'
	-D IR_RX_PINS='{{"M5 IR Mod", 4},{"G2",2},{"G6",6},{"G7",7},{"Grove 4",4},{"Grove 5",5}}'
	-D LED_ON=HIGH
	-D LED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-D RF_TX_PINS='{{"M5 RF433T", 5},{"G2",2},{"G6",6},{"G7",7},{"Grove 4",4},{"Grove 5",5}}'
	-D RF_RX_PINS='{{"M5 RF433R", 4},{"G2",2},{"G6",6},{"G7",7},{"Grove 4",4},{"Grove 5",5}}'

	-DLORA_IRQ=15
	-DLORA_BUSY=19
	-DDEFAULT_LORA_RADIO='"SX1262"'
	-DDEFAULT_LORA_FREQUENCY='"915000000.00"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified

lib_ignore =
	TFT_eSPI
