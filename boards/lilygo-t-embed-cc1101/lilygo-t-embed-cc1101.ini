
[env:lilygo-t-embed-cc1101]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}

	-Iboards/lilygo-t-embed-cc1101
	-O2

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================
	-DMIC_SPM1423  ; Board has an SPM1423 I2S microphone (needs PIN_CLK/PIN_DATA)

	-DHAS_NS4168_SPKR  ; Board has an NS4168 I2S speaker (needs BCLK/WCLK/DOUT)

	-DHAS_ENCODER  ; Board has a rotary encoder for navigation

	-DFM_SI4713  ; Board has an Adafruit Si4713 FM transmitter module

	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	-DHAS_ENCODER_LED=1  ; The rotary encoder has an RGB LED ring/indicator

	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	; ==================== Library Flags ====================

	;pins_arduino.h migration (T_EMBED_1101 branch)

	-DST7789_DRIVER=1
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DTFT_MISO=10
	-DTFT_MOSI=9
	-DTFT_SCLK=11
	-DTFT_CS=41
	-DTFT_DC=16
	-DTFT_RST=40
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================
	-DT_EMBED_1101=1

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'
	-DROTATION=3
	-DPIN_POWER_ON=15

	-DCC1101_SW1_PIN=47
	-DCC1101_SW0_PIN=48

	-DPN532_RF_REST=45
	-DPN532_IRQ=17

	-DPIN_CLK=39
	-DPIN_DATA=42
	-DBCLK=46
	-DWCLK=40
	-DDOUT=7
	-DMCLK=PIN_CLK

	-DUSE_BQ27220_VIA_I2C
	-DBQ27220_I2C_ADDRESS=0x55
	-DBQ27220_I2C_SDA=8
	-DBQ27220_I2C_SCL=18
	-DBTN_ALIAS='"Mid"'

	-DRGB_LED=14
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=8
	-DLED_COLOR_STEP=5

	-DDEEPSLEEP_WAKEUP_PIN=6
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
