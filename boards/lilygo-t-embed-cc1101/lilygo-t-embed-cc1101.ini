
[env:lilygo-t-embed-cc1101]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-O2
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=1

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

	;pins_arduino.h migration (T_EMBED_1101 branch)

	-DST7789_DRIVER=1
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DTFT_MISO=10
	-DTFT_MOSI=9
	-DTFT_SCLK=11
	-DTFT_CS=41
	-DTFT_DC=16
	-DTFT_RST=40
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000

	-DHAS_SCREEN
	-DROTATION=3
	-DPIN_POWER_ON=15

	-DFP=1
	-DFM=2
	-DFG=3

	-DCC1101_SW1_PIN=47
	-DCC1101_SW0_PIN=48

	-DPN532_RF_REST=45
	-DPN532_IRQ=17

	-DPIN_CLK=39
	-DPIN_DATA=42

	-DHAS_NS4168_SPKR
	-DBCLK=46
	-DWCLK=40
	-DDOUT=7
	-DMCLK=PIN_CLK

	-DUSE_BQ27220_VIA_I2C
	-DBQ27220_I2C_ADDRESS=0x55
	-DBQ27220_I2C_SDA=8
	-DBQ27220_I2C_SCL=18

	-DHAS_ENCODER
	-DBTN_ALIAS='"Mid"'
	-DUP_BTN=-1
	-DDW_BTN=-1

	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DFM_SI4713

	-DHAS_RGB_LED=1
	-DRGB_LED=14
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=8
	-DLED_COLOR_STEP=5
	-DHAS_ENCODER_LED=1

	-DUSB_as_HID=1

	-DDEEPSLEEP_WAKEUP_PIN=6
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
