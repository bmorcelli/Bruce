
[env:lilygo-t-embed-cc1101]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-O2
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=1

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

	;pins_arduino.h migration (T_EMBED_1101 branch)
	-DSPI_SS_PIN=8
	-DSPI_MOSI_PIN=9
	-DSPI_MISO_PIN=10
	-DSPI_SCK_PIN=11

	-DGROVE_SDA=8
	-DGROVE_SCL=18
	-DSYS_I2C_SDA=8
	-DSYS_I2C_SCL=18

	-DST7789_DRIVER=1
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DTFT_MISO=SPI_MISO_PIN
	-DTFT_MOSI=SPI_MOSI_PIN
	-DTFT_SCLK=SPI_SCK_PIN
	-DTFT_CS=41
	-DTFT_DC=16
	-DTFT_RST=40
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000

	-DHAS_SCREEN
	-DROTATION=3
	-DMINBRIGHT=1
	-DPIN_POWER_ON=15

	-DFP=1
	-DFM=2
	-DFG=3

	-DSDCARD_CS=13
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN
	-DSDCARD_SCK=SPI_SCK_PIN

	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=43
	-DNRF24_SS_PIN=44
	-DNRF24_MOSI_PIN=SDCARD_MOSI
	-DNRF24_SCK_PIN=SDCARD_SCK
	-DNRF24_MISO_PIN=SDCARD_MISO

	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=3
	-DCC1101_GDO2_PIN=38
	-DCC1101_SW1_PIN=47
	-DCC1101_SW0_PIN=48
	-DCC1101_SS_PIN=12
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN

	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=44
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=43
	-DPN532_RF_REST=45
	-DPN532_IRQ=17

	-DPIN_CLK=39
	-DPIN_DATA=42

	-DHAS_NS4168_SPKR
	-DBCLK=46
	-DWCLK=40
	-DDOUT=7
	-DMCLK=PIN_CLK

	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DTX1=SERIAL_TX
	-DRX1=SERIAL_RX

	-DUSE_BQ27220_VIA_I2C
	-DBQ27220_I2C_ADDRESS=0x55
	-DBQ27220_I2C_SDA=GROVE_SDA
	-DBQ27220_I2C_SCL=GROVE_SCL

	-DHAS_ENCODER
	-DENCODER_INA=4
	-DENCODER_INB=5
	-DENCODER_KEY=0
	-DHAS_BTN=1
	-DBTN_ALIAS='"Mid"'
	-DSEL_BTN=ENCODER_KEY
	-DUP_BTN=-1
	-DDW_BTN=-1
	-DBK_BTN=6
	-DBTN_ACT=LOW

	-DTXLED=2
	-DRXLED=1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DFM_SI4713

	-DRFID125_RX_PIN=SERIAL_RX
	-DRFID125_TX_PIN=SERIAL_TX

	-DHAS_RGB_LED=1
	-DRGB_LED=14
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_TYPE_IS_RGBW=0
	-DLED_COUNT=8
	-DLED_COLOR_STEP=5
	-DHAS_ENCODER_LED=1

	-DUSB_as_HID=1

	-DDEEPSLEEP_WAKEUP_PIN=6
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
