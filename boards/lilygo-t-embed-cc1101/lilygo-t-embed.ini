[env:lilygo-t-embed]
board = esp32s3
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-Os

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================
	-DMIC_SPM1423  ; Board has an SPM1423 I2S microphone (needs PIN_CLK/PIN_DATA)

	-DHAS_SCREEN  ; Board has a display; compiles display.cpp/main.cpp UI code paths

	-DHAS_NS4168_SPKR  ; Board has an NS4168 I2S speaker (needs BCLK/WCLK/DOUT)

	-DHAS_ENCODER  ; Board has a rotary encoder for navigation

	-DFM_SI4713  ; Board has an Adafruit Si4713 FM transmitter module

	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	-DHAS_ENCODER_LED=1  ; The rotary encoder has an RGB LED ring/indicator

	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	; ==================== Library Flags ====================

	;pins_arduino.h migration (non-CC1101 T-Embed branch)

	-DST7789_DRIVER=1
	-DUSER_SETUP_LOADED
	-DTFT_BACKLIGHT_ON=1
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=15
	-DTFT_MISO=-1
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=13
	-DTFT_RST=9
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 16", 16},{"Pin 17", 17}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Pin 16", 16},{"Pin 17", 17}, {"Pin 43", 43}, {"Pin 44", 44}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 16", 16},{"Pin 17", 17}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 16", 16},{"Pin 17", 17}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed"'
	-DROTATION=3
	-DPIN_POWER_ON=46

	-DCC1101_SW1_PIN=43
	-DCC1101_SW0_PIN=44

	-DPIN_CLK=21
	-DPIN_DATA=14
	-DBCLK=7
	-DWCLK=5
	-DDOUT=6
	-DMCLK=39

	-DANALOG_BAT_PIN=4
	-DBTN_ALIAS='"Mid"'

	-DRGB_LED=42
	-DRGB_LED_CLK=45
	-DLED_TYPE=APA102
	-DLED_ORDER=BGR
	-DLED_COUNT=8
	-DLED_COLOR_STEP=5

	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.2.6
