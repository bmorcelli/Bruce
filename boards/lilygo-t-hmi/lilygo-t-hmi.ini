[env:lilygo-t-hmi]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-hmi>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-hmi
	-Os
	-DCORE_DEBUG_LEVEL=1

	-DRF_TX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'

	-D TOUCH_XPT2046_SPI
	-D XPT2046_TOUCH_CONFIG_INT_GPIO_NUM=9
	-D XPT2046_SPI_BUS_MISO_IO_NUM=4
	-D XPT2046_SPI_BUS_MOSI_IO_NUM=3
	-D XPT2046_SPI_BUS_SCLK_IO_NUM=1
	-D XPT2046_SPI_CONFIG_CS_GPIO_NUM=2

	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Lilygo T-HMI"'
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM


	; it is physically grounded, using a NC(33) pin to avoid warnings on Serial during SD Readings

	; touch screen XPT2046
	; Pins set on .ini file
	-DHAS_TOUCH=1

	; TFT_eSPI display
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DTFT_PARALLEL_8_BIT
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=-1
	-DTFT_WR=8
	-DTFT_RD=-1
	-DTFT_D0=48
	-DTFT_D1=47
	-DTFT_D2=39
	-DTFT_D3=40
	-DTFT_D4=41
	-DTFT_D5=42
	-DTFT_D6=45
	-DTFT_D7=46
	-DTFT_BL=38
	-DSMOOTH_FONT=1

	; Display Setup
	-DHAS_SCREEN
	-DROTATION=3

	; Font Sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Battery PIN
	-DANALOG_BAT_PIN=5

	; Mic
	-DPIN_CLK=-1
	-DPIN_DATA=-1

	; Buttons & Navigation
	-DBTN_ALIAS='"OK"'

	; IR pins
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; BadUSB
	-DUSB_as_HID=1

