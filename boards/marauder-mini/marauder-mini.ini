; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Marauder-Mini]
board = esp32
board_build.f_flash = 80000000L
board_upload.speed = 1500000
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/marauder-mini>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/marauder-mini

	-D MARAUDER_MINI
	-DARDUINO_ESP32_DEV

	;pins_arduino.h migration
	-DUSB_VID=0x303a
	-DUSB_PID=0x1001
	; Modified elsewhere
	-DRGB_LED=21
	-DBAD_TX=21
	-DBAD_RX=22
	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=21
	-DSERIAL_RX=22
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DHAS_BTN=1
	-DSEL_BTN=34
	-DUP_BTN=36
	-DDW_BTN=35
	-DR_BTN=39
	-DL_BTN=13
	-DHAS_5_BUTTONS
	-DBTN_ALIAS='"Ok"'
	-DBTN_ACT=LOW
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=-1
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DNRF24_CE_PIN=-1
	-DNRF24_SS_PIN=-1
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	-DFP=1
	-DFM=1
	-DFG=2
	-DHAS_SCREEN=1
	-DROTATION=0
	-DMINBRIGHT=160
	-DSDCARD_CS=4
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23
	-DGROVE_SDA=33
	-DGROVE_SCL=26
	-DSPI_SCK_PIN=18
	-DSPI_MISO_PIN=19
	-DSPI_MOSI_PIN=23
	-DSPI_SS_PIN=1
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB3
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=128
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_BL=32
	-DTFT_CS=17
	-DTFT_DC=16
	-DTFT_RST=5
	-DTFT_BACKLIGHT_ON=LOW
	-DSMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=16000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=-1

	-DDEVICE_NAME='"Marauder mini"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}

[env:Awok-Mini]
extends = env:Marauder-Mini
board_build.partitions = custom_16Mb.csv
board_upload.maximum_size = 16777216
board_upload.flash_size=16MB

