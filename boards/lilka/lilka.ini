[env:lilka]
board = esp32s3
build_src_filter = ${env.build_src_filter} +<../boards/lilka>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_flags =
	${env.build_flags}
	-Iboards/lilka
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DLILKA_BOARD

	; Piezo buzzer (GPIO11 from schematic)
	-DBUZZ_PIN=11

	; Second SPI bus (modules on the extension header) -> HSPI peripheral
	-DUSE_HSPI_PORT=1

	-DDEVICE_NAME='"Lilka v2.3"'

	; --- migrated from pins_arduino.h ---
	; ===== USB =====
	-DUSB_VID=0x303A
	; ===== SERIAL (on the extension header) + BadUSB + GPS =====
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DTX1=SERIAL_TX
	-DRX1=SERIAL_RX
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DUSB_as_HID=1
	-DBAD_TX=SERIAL_TX
	-DBAD_RX=SERIAL_RX
	; ===== I2C =====
	; GROVE_SDA/SCL is just Bruce's macro name for the "default I2C pins"
	; (Lilka has no Grove connector). Values are a pair from the extension header.
	; NOTE: overlaps the module bus below (only 6 GPIO on the header).
	-DGROVE_SDA=13
	-DGROVE_SCL=14
	; ===== MAIN SPI bus (internal): ST7789 display + SD card =====
	; Arduino-default SPI. Display is write-only; MISO is only for the SD card.
	; ===== SECOND SPI bus: modules on the extension header (HSPI) =====
	; Requires -DUSE_HSPI_PORT=1 in lilka.ini
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=14
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=47
	; ===== BUTTONS (active LOW, internal pull-ups) =====
	-DBTN_ALIAS='"A"'
	-DHAS_5_BUTTONS
	-DUP_BTN=38
	-DDW_BTN=41
	-DL_BTN=39
	-DR_BTN=40
	-DSEL_BTN=5
	-DESC_BTN=6
	-DBTN_ACT=LOW
	; ===== BATTERY (via ADC, no PMIC) =====
	-DANALOG_BAT_PIN=3
	; ===== FONTS =====
	-DFP=1
	-DFM=2
	-DFG=3
	; ===== TFT_eSPI (ST7789, 1.69" IPS, 280x240) =====
	-DHAS_SCREEN=1
	-DROTATION=3
	-DMINBRIGHT=(uint8_t)1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_INVERSION_ON
	-DTFT_RGB_ORDER=0
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=46
	-DTFT_RST=-1
	-DTFT_DC=15
	-DTFT_CS=7
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_MISO=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; ===== SD CARD (main bus) =====
	-DSDCARD_CS=16
	-DSDCARD_SCK=18
	-DSDCARD_MISO=8
	-DSDCARD_MOSI=17
	; ===== IR (extension header) =====
	; RXLED is the default IR-RX pin (used by interface.cpp irRx); the lists let
	; the user pick the pin from the Bruce menu.
	-DRXLED=21
	-DTXLED=21
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 21", 21}, {"GPIO 47", 47}, {"GPIO 48", 48}}'
	-DIR_RX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 21", 21}, {"GPIO 47", 47}, {"GPIO 48", 48}}'
	; ===== RF (sub-GHz one-pin modules) - same pin choices as IR =====
	-DRF_TX_PINS=IR_TX_PINS
	-DRF_RX_PINS=IR_RX_PINS
	; ===== CC1101 (sub-GHz, module bus) =====
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=21
	-DCC1101_GDO2_PIN=48
	-DCC1101_SS_PIN=47
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	; ===== NRF24 (module bus) =====
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=21
	-DNRF24_SS_PIN=47
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	; ===== LoRa (external module on the extension header) =====
	; Enabled simply by defining LORA_SCK. Pins for an SX126x-class module
	; (note: BUSY/IRQ reuse the UART pins 43/44).
	-DLORA_SCK=14
	-DLORA_MISO=47
	-DLORA_MOSI=21
	-DLORA_CS=13
	-DLORA_RST=48
	-DLORA_BUSY=43
	-DLORA_IRQ=44
	; ===== Deep sleep: wake on Select button (GPIO0) =====
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
