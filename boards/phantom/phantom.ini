; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################### CYD MODELS ####################################################
[env:Phantom_S024R]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/phantom>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/phantom
 ;key for new device,
					;mykeyboard.cpp: need map buttons an/or touchscreen and battery status value,
					;settings.cpp:   need map brighness control
					;main.cpp:		  need set startup
					;serialcmds.cpp: need set power off command
	;Features Enabled
	;FM Radio

	; ==================== Feature gates ====================
	-DFM_SI4713=1  ;Uncomment to activate FM Radio using Adafruit Si4713
	;-DLITE_VERSION=1  ;limits some features to save space for M5Launcher Compatibility
	;Microphone
	;-DMIC_SPM1423=1  ;uncomment to enable Applicable for SPM1423 device

	;RGB LED runned by xylopyrographer/LiteLED@^1.2.0 library
	;-DHAS_RGB_LED=1  ;uncomment to enable

	;Have RTC Chip
	;-DHAS_RTC=1

	;Speaker to run music, compatible with NS4168
	;-DHAS_NS4168_SPKR=1  ;uncomment to enable

	;Can run USB as HID
	;-DUSB_as_HID=1  ;uncomment to enable

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Screen Setup
	-DHAS_SCREEN=1

	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	-DTFT_BL=27
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33
	-DUSE_TFT_eSPI_TOUCH

	; ==================== Environment Flags ====================
	-DPIN_CLK=-1
	-DPIN_DATA=-1
	-DRGB_LED=-1
	-DBCLK=-1
	-DWCLK=-1
	-DDOUT=-1

	;Battery ADC read pin
	;-DBAT_PIN=10

	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}}'
	-DIR_RX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}, {"Pin 35", 35}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}}'
	-DRF_RX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}, {"Pin 35", 35}}'

	-DROTATION=1

	-DDEVICE_NAME='"Phantom S024R"'

	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=36
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


[env:LAUNCHER_Phantom_S024R]
extends = env:Phantom_S024R
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Phantom_S024R.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}



################################# END OF CYD MODELS ####################################################
