; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare-c5-tft]
board = esp32c5
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =${env.build_src_filter} +<../boards/waveshare-c5-tft>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-c5-tft
	-DDEVICE_NAME='"ESP32-C5"'
	-DESP32C5_DEVKITC_1_TFT=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1

	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h
	-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3

	;FM Radio
	;-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713

	; ---- migrated from pins_arduino.h ----
	-DPIN_RGB_LED=27
	; BUILTIN_LED can be used in new Arduino API digitalWrite() like in Blink.ino
	; RGB_BUILTIN and RGB_BRIGHTNESS can be used in new Arduino API rgbLedWrite()
	; LP I2C Pins are fixed on ESP32-C5
	-DLP_SDA=4
	-DLP_SCL=5
	-DWIRE1_PIN_DEFINED
	-DHAS_RGB_LED=1
	-DLED_ORDER=GRB
	-DLED_TYPE_IS_RGBW=1
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	; UART
	-DSERIAL_TX=11
	-DSERIAL_RX=12
	; I2C
	-DGROVE_SDA=4
	-DGROVE_SCL=5
	; SPI
	-DSPI_SCK_PIN=10
	-DSPI_MOSI_PIN=8
	-DSPI_MISO_PIN=9
	-DSPI_SS_PIN=3
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=4
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=172
	-DTFT_HEIGHT=320
	; Common TFT definitions
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=-1
	-DTFT_DC=24
	-DTFT_MISO=SPI_MISO_PIN
	-DTFT_MOSI=SPI_MOSI_PIN
	-DTFT_SCLK=SPI_SCK_PIN
	-DTFT_CS=23
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	; Bad USB with CH9329
	-DBAD_RX=4
	-DBAD_TX=5
	; GPS Bus
	-DGPS_SERIAL_TX=5
	-DGPS_SERIAL_RX=4
	-DBTN_ALIAS='"OK"'
	-DHAS_5_BUTTONS
	-DSEL_BTN=28
	-DDW_BTN=1
	-DUP_BTN=0
	-DR_BTN=13
	-DL_BTN=14
	-DBTN_ACT=LOW
	-DDEEPSLEEP_WAKEUP_PIN=SEL_BTN
	; InfraRed
	-DRXLED=26
	-DTXLED=7
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	; SDCard
	-DSDCARD_CS=6
	-DSDCARD_SCK=SPI_SCK_PIN
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN
	; CC1101
	; #define CC1101_GDO2_PIN 7 // not necessary
	-DCC1101_GDO0_PIN=2
	-DCC1101_SS_PIN=3
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	; NRF24
	-DNRF24_CE_PIN=2
	-DNRF24_SS_PIN=3
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	; Ethernet
	-DW5500_INT_PIN=2
	-DW5500_SS_PIN=3
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
