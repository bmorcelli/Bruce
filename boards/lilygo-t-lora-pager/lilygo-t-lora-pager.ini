
[env:lilygo-t-lora-pager]
board = esp32s3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-lora-pager>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-lora-pager
	-O2
	-DMIC_SPM1423
	-DCGRAM_OFFSET
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DT_LORA_PAGER

	-DUSB_PID=0x82D4
	-DUSB_MANUFACTURER='"LILYGO"'
	-DUSB_PRODUCT='"T-LoRa-Pager"'
	-DDEVICE_NAME='"Lilygo T-Lora Pager"'

	-DHAS_KEYBOARD
	-DHAS_KEYBOARD_HID
	-DKB_HID_EXIT_MSG='"fn + Ok to exit"'
	-DKB_I2C_ADDRESS=0x34
	-DKEYBOARD_BL=46

	; Battery charger
	-DBQ25896_I2C_ADDRESS=0x6B

	; IO Expander
	-DEXPANDS_DRV_EN=0
	-DEXPANDS_AMP_EN=1
	-DEXPANDS_KB_RST=2
	-DEXPANDS_LORA_EN=3
	-DEXPANDS_GPS_EN=4
	-DEXPANDS_NFC_EN=5
	-DEXPANDS_GPS_RST=7
	-DEXPANDS_KB_PWR=8
	-DEXPANDS_KB_EN=10
	-DEXPANDS_GPIO_EN=11
	-DEXPANDS_SD_DET=12
	-DEXPANDS_SD_EN=14
	-DIO_EXPANDER_PCA9555
	; to make GPS stays turned on all the time
	; making Wardrive start way faster
	; comment the next line
	-DIO_EXP_GPS=EXPANDS_GPS_EN
	-DIO_EXP_NFC=EXPANDS_NFC_EN

	; Main SPI Bus
	-DSPI_SS_PIN=21
	-DSPI_MOSI_PIN=34
	-DSPI_MISO_PIN=33
	-DSPI_SCK_PIN=35

	; Set Main I2C Bus
	-DGROVE_SDA=3
	-DGROVE_SCL=2
	-DSYS_I2C_SDA=3
	-DSYS_I2C_SCL=2

	; TFT_eSPI display
	-DST7796_DRIVER=1
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=222
	-DTFT_HEIGHT=480
	-DTFT_BL=42
	-DTFT_MISO=SPI_MISO_PIN
	-DTFT_MOSI=SPI_MOSI_PIN
	-DTFT_SCLK=SPI_SCK_PIN
	-DTFT_CS=38
	-DTFT_DC=37
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000

	; Display Setup
	-DHAS_SCREEN
	-DROTATION=3
	-DMINBRIGHT=(uint8_t)1

	; Font Sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; SD Card
	-DSDCARD_CS=21
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN
	-DSDCARD_SCK=SPI_SCK_PIN

	; NRF24 - Over GPIO expansion header
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=43
	-DNRF24_SS_PIN=44
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	; CC1101 - Over GPIO expansion header
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=43
	-DCC1101_GDO2_PIN=9
	-DCC1101_SS_PIN=44
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN

	; W5500 over QWIIC port
	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=44
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=43

	; Serial
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DTX1=SERIAL_TX
	-DRX1=SERIAL_RX

	; Fuel Gauge
	-DUSE_BQ27220_VIA_I2C
	-DBQ27220_I2C_ADDRESS=0x55
	-DBQ27220_GROVE_SDA=GROVE_SDA
	-DBQ27220_GROVE_SCL=GROVE_SCL

	; Encoder
	-DHAS_ENCODER
	-DENCODER_INA=40
	-DENCODER_INB=41
	-DENCODER_KEY=7
	-DHAS_BTN=1
	-DBTN_ALIAS='"Mid"'
	-DSEL_BTN=ENCODER_KEY
	-DUP_BTN=-1
	-DDW_BTN=-1
	-DBK_BTN=0
	-DBTN_ACT=LOW

	; IR
	-DTXLED=-1
	-DRXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; FM Radio
	-DFM_SI4713

	; RFID
	-DRFID125_RX_PIN=SERIAL_RX
	-DRFID125_TX_PIN=SERIAL_TX

	; RTC
	-DHAS_RTC
	-DRTC_SDA=GROVE_SDA
	-DRTC_SCL=GROVE_SCL
	-DRTC_INTERRUPT_PIN=1
	-DHAS_RTC_PCF85063A

	; BadUSB
	-DUSB_as_HID=1

	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

	-DCAPS_LOCK=0x00
	-DKEY_SHIFT=0x1c
	-DKEY_FN=0x14
	-DKEY_BACKSPACE=0x08
	-DKEY_ENTER=0x0D
	-DKEY_TAB=0x2b

	; Interrupt IO
	-DRTC_INT=1
	-DNFC_INT=5
	-DSENSOR_INT=8
	-DNFC_CS=39

	; NFC ST25R3916
	-DHAS_ST25R3916
	-DST25R_MISO=SPI_MISO_PIN
	-DST25R_MOSI=SPI_MOSI_PIN
	-DST25R_SCLK=SPI_SCK_PIN
	-DST25R_CS=39
	-DST25R_IRQ=5

	; Audio ES8311
	-DAUDIO_I2S_WS=18
	-DAUDIO_I2S_SCK=11
	-DAUDIO_I2S_MCLK=10
	-DAUDIO_I2S_SDOUT=45
	-DAUDIO_I2S_SDIN=17

	; Speaker
	-DHAS_NS4168_SPKR
	-DHAS_ES8311
	-DES8311_CODEC=1
	-DES8311_ADDR=0x18
	-DBCLK=11
	-DWCLK=18
	-DDOUT=45
	-DMCLK=10

	; Mic
	-DPIN_BCLK=18
	-DPIN_CLK=11
	-DPIN_DATA=17

	; GPS
	-DGPS_SERIAL_TX=12
	-DGPS_SERIAL_RX=4
	-DGPS_SERIAL_PPS=13

	; LoRa
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=36
	-DLORA_RST=47
	-DLORA_DIO0=14
	-DLORA_BUSY=48
	-DLORA_IRQ=14

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0
	lewisxhe/SensorLib@0.3.4
	adafruit/Adafruit TCA8418 @ ^1.0.2
	# renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.1.3.zip
