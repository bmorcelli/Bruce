; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c5-tft]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP32-C5-tft>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5-tft
	-DDEVICE_NAME='"ESP32-C5"'
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1

	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h
	-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; ui control buttons
	-DBTN_ALIAS='"OK"'

	;FM Radio
	-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713

	; pins_arduino.h pins
	; BUILTIN_LED can be used in new Arduino API digitalWrite() like in Blink.ino
	; RGB_BUILTIN and RGB_BRIGHTNESS can be used in new Arduino API rgbLedWrite()
	; LP I2C Pins are fixed on ESP32-C5
	-DWIRE1_PIN_DEFINED
	-DHAS_RGB_LED=1
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27

	; Communication Buses
	; UART
	; I2C
	; SPI

	; TFT definitions
	-DHAS_SCREEN=1
	-DROTATION=1
	-DUSER_SETUP_LOADED=1
	; Setup for ILI9341 320x240 (no touch)
	-DILI9341_DRIVER=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	; Common TFT definitions
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=-1
	-DTFT_DC=24
	-DTFT_MISO=2
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=23
	-DTOUCH_CS=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Peripheral settings

	; ILI9341_DRIVER is always defined above on this board, so only the
	; touch-screen branch of the original #ifdef ILI9341_DRIVER / #else
	; applies here (the #else "Buttons" branch is dead code for this board)
	; Touch Screen
	-DUSE_TFT_eSPI_TOUCH=1
	-DHAS_TOUCH=1
	-DBTN_ACT=LOW
	-DDEEPSLEEP_WAKEUP_PIN=0

	; InfraRed
	-DLED_ON=HIGH
	-DLED_OFF=LOW

