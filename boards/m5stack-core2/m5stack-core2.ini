; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_16Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 4521984
;board_upload.maximum_ram_size=532480
build_src_filter =${env.build_src_filter} +<../boards/m5stack-core2>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-core2
	-DCORE_DEBUG_LEVEL=1
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-DARDUINO_M5STACK_CORE2
	-DBOARD_HAS_PSRAM

	;Features Enabled
	;-DLITE_VERSION=1 ;limits some features to save space for M5Launcher Compatibility
	;FM Radio
	-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713
	;Microphone
	-DMIC_SPM1423=1 ;uncomment to enable Applicable for SPM1423 device
	-DPIN_CLK=0
	-DPIN_DATA=34

	;RGB LED runned by xylopyrographer/LiteLED@^1.2.0 library
	;-DHAS_RGB_LED=1  ;uncomment to enable
	-DRGB_LED=-1

	;Have RTC Chip
	-DHAS_RTC=1
	-DRTC_SDA=21
	-DRTC_SCL=22

	;Have buzzer
	;-DBUZZ_PIN=2

	;Speaker to run music, compatible with NS4168
	;-DHAS_NS4168_SPKR=1 ;uncomment to enable
	-DBCLK=12
	-DWCLK=0
	-DDOUT=2

	;Can run USB as HID
	;-DUSB_as_HID=1 ;uncomment to enable

	;Battery ADC read pin
	;-DBAT_PIN=10

	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Touchscreen Config
	-DHAS_TOUCH=1

	-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"M5 IR Mod", 32}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 33}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"M5 RF433T", 32}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DRF_RX_PINS='{{"M5 RF433R", 33}, {"Grove W", 33}, {"Grove Y", 32}}'

	;Font sizes, depending on device
	-DFP=1
	-DFM=2
	-DFG=3

	;Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=1
	;-DBACKLIGHT=38
	;-DMINBRIGHT=160

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DM5STACK=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=38
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=15
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000

	-DDEVICE_NAME='"M5Stack Core 2"'

	; pins_arduino.h pins
	-DTX2=14
	-DRX2=13
lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.11
