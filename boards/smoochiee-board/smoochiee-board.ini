; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:smoochiee-board]
board = esp32s3
build_src_filter =${env.build_src_filter} +<../boards/smoochiee-board>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	;Have buzzer
	-DMIC_INMP441
	-DBUZZ_PIN=44
	-D USE_HSPI_PORT=1
	-DDEVICE_NAME='"Smoochiee Board"'
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DSMOOCHIEE_BOARD

	; Modified elsewhere

	-DSERIAL_RX=2
	-DSERIAL_TX=1
	-DBAD_RX=SERIAL_RX
	-DBAD_TX=SERIAL_TX
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DUSB_as_HID=1

	-DBTN_ALIAS='"OK"'
	-DHAS_5_BUTTONS
	-DSEL_BTN=0
	-DUP_BTN=41
	-DDW_BTN=40
	-DR_BTN=38
	-DL_BTN=39
	-DBTN_ACT=LOW

	-DRXLED=4
	-DTXLED=5
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=9
	-DCC1101_GDO2_PIN=10
	-DCC1101_SS_PIN=46
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=21
	-DNRF24_SS_PIN=14
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	-DFP=1
	-DFM=2
	-DFG=3

	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1

	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MISO=8
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_CS=7
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	-DSDCARD_CS=3
	-DSDCARD_SCK=18
	-DSDCARD_MISO=8
	-DSDCARD_MOSI=17

	-DGROVE_SDA=47
	-DGROVE_SCL=48
	-DSYS_I2C_SDA=47
	-DSYS_I2C_SCL=48

	-DSPI_SCK_PIN=13
	-DSPI_MOSI_PIN=12
	-DSPI_MISO_PIN=11
	-DSPI_SS_PIN=43

	; RGB LED
	-DHAS_RGB_LED=1
	-DRGB_LED=45
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_TYPE_IS_RGBW=0
	-DLED_COUNT=16
	-DLED_COLOR_STEP=15

	-DXPOWERS_CHIP_BQ25896
	; USE BOOST ENABLE PMIC 5V OUTPUT
	-DUSE_BOOST

	; Mic
	-DPIN_CLK=1
	-DPIN_DATA=10
	-DPIN_WS=2

	; IO EXPANDER
	-DUSE_IO_EXPANDER
	-DIO_EXPANDER_AW9523
	-DIO_EXP_GPS=13
	-DIO_EXP_MIC=4
	-DIO_EXP_VIBRO=2
	-DIO_EXP_CC_RX=7
	-DIO_EXP_CC_TX=12

lib_deps =
	    ${env.lib_deps}
      lewisxhe/XPowersLib @0.3.0
